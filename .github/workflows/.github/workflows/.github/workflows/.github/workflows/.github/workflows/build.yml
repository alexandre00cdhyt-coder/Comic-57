          import dagger.Module; import dagger.Provides; import dagger.hilt.InstallIn; import dagger.hilt.android.qualifiers.ApplicationContext
          import dagger.hilt.components.SingletonComponent; import javax.inject.Singleton
          @Module @InstallIn(SingletonComponent::class)
          object DatabaseModule {
              @Provides @Singleton fun provideDatabase(@ApplicationContext context: Context): AppDatabase = Room.databaseBuilder(context, AppDatabase::class.java, "manga_universal.db").build()
              @Provides fun provideBookDao(db: AppDatabase): BookDao = db.bookDao()
              @Provides fun provideHistoryDao(db: AppDatabase): HistoryDao = db.historyDao()
          }
          EOF

