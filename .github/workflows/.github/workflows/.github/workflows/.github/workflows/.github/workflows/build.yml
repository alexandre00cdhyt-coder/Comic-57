          cat << 'EOF' > app/src/main/java/com/mangauniversal/app/data/archive/ArchiveReader.kt
          package com.mangauniversal.app.data.archive
          import com.mangauniversal.app.domain.model.Page
          interface ArchiveReader {
              suspend fun getPages(fileUriOrPath: String): List<Page>
              fun isSupported(filePath: String): Boolean
