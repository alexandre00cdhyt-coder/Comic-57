          cat << 'EOF' > app/src/main/java/com/mangauniversal/app/data/archive/CbzArchiveReader.kt
          package com.mangauniversal.app.data.archive
          import android.content.Context; import android.graphics.Bitmap; import android.graphics.BitmapFactory
          import android.net.Uri; import com.mangauniversal.app.domain.model.Page; import com.mangauniversal.app.domain.util.NaturalOrderComparator
          import kotlinx.coroutines.Dispatchers; import kotlinx.coroutines.withContext
          import java.io.InputStream; import java.util.zip.ZipEntry; import java.util.zip.ZipInputStream; import javax.inject.Inject
          class CbzArchiveReader @Inject constructor(private val context: Context) : ArchiveReader {
              private val supportedExtensions = setOf("jpg", "jpeg", "png", "webp", "bmp", "gif")
              override fun isSupported(filePath: String): Boolean {
                  val lower = filePath.lowercase()
                  return lower.endsWith(".cbz") || lower.endsWith(".zip")
              }
              override suspend fun getPages(fileUriOrPath: String): List<Page> = withContext(Dispatchers.IO) {
                  val pageEntries = mutableListOf<String>()
                  val uri = Uri.parse(fileUriOrPath)
                  openInputStream(uri)?.use { inputStream ->
                      ZipInputStream(inputStream).use { zip ->
                          var entry: ZipEntry? = zip.nextEntry
                          while (entry != null) {
                              if (!entry.isDirectory && isImageFile(entry.name) && !isJunkFile(entry.name)) { pageEntries.add(entry.name) }
                              zip.closeEntry(); entry = zip.nextEntry
                          }
                      }
                  }
                  val sortedEntries = pageEntries.sortedWith(NaturalOrderComparator())
                  return@withContext sortedEntries.mapIndexed { index, entryName ->
                      Page(index = index, name = entryName, archivePath = fileUriOrPath, bitmapSupplier = { loadBitmapFromZip(uri, entryName) })
                  }
              }
              private suspend fun loadBitmapFromZip(uri: Uri, entryName: String): Bitmap? = withContext(Dispatchers.IO) {
                  try {
                      openInputStream(uri)?.use { inputStream ->
                          ZipInputStream(inputStream).use { zip ->
                              var entry: ZipEntry? = zip.nextEntry
                              while (entry != null) {
                                  if (entry.name == entryName) {
                                      val options = BitmapFactory.Options().apply { inPreferredConfig = Bitmap.Config.RGB_565 }
                                      return@withContext BitmapFactory.decodeStream(zip, null, options)
                                  }
                                  zip.closeEntry(); entry = zip.nextEntry
                              }
                          }
                      }
                  } catch (e: Exception) { e.printStackTrace() }
                  return@withContext null
              }
              private fun openInputStream(uri: Uri): InputStream? {
                  return if (uri.scheme == "content") context.contentResolver.openInputStream(uri)
                  else java.io.File(uri.path ?: "").inputStream()
              }
              private fun isImageFile(name: String) = supportedExtensions.contains(name.substringAfterLast('.', "").lowercase())
              private fun isJunkFile(name: String) = name.contains("__MACOSX") || name.contains("Thumbs.db") || name.startsWith(".")
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mangauniversal/app/data/archive/DirectoryArchiveReader.kt
          package com.mangauniversal.app.data.archive
          import android.graphics.Bitmap; import android.graphics.BitmapFactory
          import com.mangauniversal.app.domain.model.Page; import com.mangauniversal.app.domain.util.NaturalOrderComparator
          import kotlinx.coroutines.Dispatchers; import kotlinx.coroutines.withContext; import java.io.File; import javax.inject.Inject
          class DirectoryArchiveReader @Inject constructor() : ArchiveReader {
              private val supportedExtensions = setOf("jpg", "jpeg", "png", "webp", "bmp", "gif")
              override fun isSupported(filePath: String): Boolean { val file = File(filePath); return file.exists() && file.isDirectory }
              override suspend fun getPages(fileUriOrPath: String): List<Page> = withContext(Dispatchers.IO) {
                  val dir = File(fileUriOrPath)
                  if (!dir.exists() || !dir.isDirectory) return@withContext emptyList()
                  val files = dir.listFiles { _, name -> supportedExtensions.contains(name.substringAfterLast('.', "").lowercase()) && !name.startsWith(".") } ?: emptyArray()
                  val sortedFiles = files.sortedWith(Comparator { f1, f2 -> NaturalOrderComparator().compare(f1.name, f2.name) })
                  return@withContext sortedFiles.mapIndexed { index, file ->
                      Page(index = index, name = file.name, archivePath = file.absolutePath, bitmapSupplier = { loadBitmapFromFile(file) })
                  }
              }
              private suspend fun loadBitmapFromFile(file: File): Bitmap? = withContext(Dispatchers.IO) {
                  try {
                      val options = BitmapFactory.Options().apply { inPreferredConfig = Bitmap.Config.RGB_565 }
                      return@withContext BitmapFactory.decodeFile(file.absolutePath, options)
                  } catch (e: Exception) { e.printStackTrace(); return@withContext null }
              }
          }
