name: Compilar Lumi con icono H

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Dar permisos a gradlew
        run: chmod +x lumi/gradlew

      - name: Cambiar nombre de la app a H
        run: |
          cd lumi
          find . -name "strings.xml" -path "*/values/*" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">H<\/string>/g' {} \;
          echo "Nombre cambiado"

      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Reemplazar iconos (borrar webp y poner png H)
        run: |
          cd lumi
          
          # BORRAR todos los iconos originales de Lumi (png, webp y xml)
          find app/src/main/res -name "ic_launcher*" -type f -delete
          echo "Iconos originales borrados"
          
          # Crear iconos H nuevos
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          convert -size 48x48 xc:"#1565C0" -fill white -gravity center -pointsize 36 -annotate +0+0 "H" app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -size 72x72 xc:"#1565C0" -fill white -gravity center -pointsize 54 -annotate +0+0 "H" app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -size 96x96 xc:"#1565C0" -fill white -gravity center -pointsize 72 -annotate +0+0 "H" app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -size 144x144 xc:"#1565C0" -fill white -gravity center -pointsize 108 -annotate +0+0 "H" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -size 192x192 xc:"#1565C0" -fill white -gravity center -pointsize 144 -annotate +0+0 "H" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          echo "=== Iconos nuevos ==="
          ls -la app/src/main/res/mipmap-*/ic_launcher.png

      - name: Compilar APK
        run: |
          cd lumi
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          echo "=== Buscando APK ==="
          find lumi -name "*.apk" -type f
          ls -la lumi/app/build/outputs/apk/debug/ 2>/dev/null || echo "No se encontro carpeta debug"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-H-APK
          path: lumi/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
