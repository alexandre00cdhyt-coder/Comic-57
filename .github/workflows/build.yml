          package com.mangauniversal.app.ui.reader
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.unit.dp
          import com.mangauniversal.app.R
          import com.mangauniversal.app.domain.model.ReadingMode
          import com.mangauniversal.app.ui.reader.components.*
          @Composable fun ReaderScreen(filePath: String, title: String, viewModel: ReaderViewModel) {
              val uiState by viewModel.uiState.collectAsState()
              LaunchedEffect(filePath) { viewModel.loadBook(filePath, title) }
              Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                  when {
                      uiState.isLoading -> CircularProgressIndicator(modifier = Modifier.align(Alignment.Center), color = Color.White)
                      uiState.error != null -> Text(text = uiState.error ?: stringResource(R.string.error_opening_file), color = Color.Red, modifier = Modifier.align(Alignment.Center))
                      uiState.pages.isNotEmpty() -> {
                          if (uiState.readingMode == ReadingMode.HORIZONTAL_PAGED) {
                              HorizontalReader(pages = uiState.pages, initialPage = uiState.currentPage, direction = uiState.readingDirection, onPageChanged = { viewModel.onPageChanged(it) })
                          } else {
                              VerticalReader(pages = uiState.pages, initialPage = uiState.currentPage, onPageChanged = { viewModel.onPageChanged(it) })
                          }
                          Text(text = stringResource(R.string.page_indicator, uiState.currentPage + 1, uiState.pages.size), color = Color.White, style = MaterialTheme.typography.bodySmall, modifier = Modifier.align(Alignment.BottomCenter).padding(16.dp).background(Color.Black.copy(alpha = 0.6f)).padding(horizontal = 8.dp, vertical = 4.dp))
                      }
                  }
              }
          }
