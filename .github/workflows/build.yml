name: Ver CoverManager y dependientes

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: CoverManager.kt original
        run: |
          echo "========== CoverManager.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/parser/CoverManager.kt"

      - name: CacheCleaner.kt
        run: |
          echo "========== CacheCleaner.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/CacheCleaner.kt"

      - name: CoverImage.kt
        run: |
          echo "========== CoverImage.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/components/CoverImage.kt"

      - name: Copiar a artifact
        run: |
          mkdir -p archivos_fix
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/parser/CoverManager.kt" archivos_fix/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/CacheCleaner.kt" archivos_fix/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/components/CoverImage.kt" archivos_fix/
          echo "=== Archivos copiados ==="
          ls -la archivos_fix/

      - name: Subir archivos
        uses: actions/upload-artifact@v4
        with:
          name: archivos-fix
          path: archivos_fix/
          if-no-files-found: error
