name: Ver build.gradle de Lumi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: Listar archivos gradle
        run: |
          echo "=== Archivos gradle en el proyecto ==="
          find lumi -name "*.gradle" -o -name "*.gradle.kts" | grep -v "/build/"

      - name: Mostrar app/build.gradle
        run: |
          APP_GRADLE=$(find lumi -name "build.gradle" -path "*/app/*" | head -1)
          echo "=== Archivo: $APP_GRADLE ==="
          cat "$APP_GRADLE"

      - name: Mostrar app/build.gradle.kts (si existe)
        run: |
          APP_GRADLE_KTS=$(find lumi -name "build.gradle.kts" -path "*/app/*" | head -1)
          if [ -n "$APP_GRADLE_KTS" ]; then
            echo "=== Archivo: $APP_GRADLE_KTS ==="
            cat "$APP_GRADLE_KTS"
          else
            echo "No existe build.gradle.kts"
          fi

      - name: Mostrar gradle/libs.versions.toml (si existe)
        run: |
          TOML=$(find lumi -name "libs.versions.toml" | head -1)
          if [ -n "$TOML" ]; then
            echo "=== Archivo: $TOML ==="
            cat "$TOML"
          else
            echo "No existe libs.versions.toml"
          fi

      - name: Copiar a artifact
        run: |
          mkdir -p archivos_gradle
          APP_GRADLE=$(find lumi -name "build.gradle" -path "*/app/*" | head -1)
          APP_GRADLE_KTS=$(find lumi -name "build.gradle.kts" -path "*/app/*" | head -1)
          TOML=$(find lumi -name "libs.versions.toml" | head -1)
          [ -n "$APP_GRADLE" ] && cp "$APP_GRADLE" archivos_gradle/
          [ -n "$APP_GRADLE_KTS" ] && cp "$APP_GRADLE_KTS" archivos_gradle/
          [ -n "$TOML" ] && cp "$TOML" archivos_gradle/
          ls -la archivos_gradle/

      - name: Subir archivos
        uses: actions/upload-artifact@v4
        with:
          name: archivos-gradle
          path: archivos_gradle/
          if-no-files-found: error
