name: Compilar Lumi con icono H

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi
          cd lumi
          git checkout main

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Dar permisos a gradlew
        run: chmod +x lumi/gradlew

      - name: Cambiar nombre de la app a H
        run: |
          cd lumi
          # Buscar y reemplazar el nombre de la app
          find . -name "strings.xml" -path "*/values/*" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">H<\/string>/g' {} \;

      - name: Crear icono con letra H
        run: |
          cd lumi
          # Crear carpetas de mipmap si no existen
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          # Descargar un icono de letra H de ejemplo (puedes cambiarlo después)
          curl -L -o app/src/main/res/mipmap-mdpi/ic_launcher.png "https://via.placeholder.com/48x48/1565C0/FFFFFF?text=H"
          curl -L -o app/src/main/res/mipmap-hdpi/ic_launcher.png "https://via.placeholder.com/72x72/1565C0/FFFFFF?text=H"
          curl -L -o app/src/main/res/mipmap-xhdpi/ic_launcher.png "https://via.placeholder.com/96x96/1565C0/FFFFFF?text=H"
          curl -L -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png "https://via.placeholder.com/144x144/1565C0/FFFFFF?text=H"
          curl -L -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "https://via.placeholder.com/192x192/1565C0/FFFFFF?text=H"

      - name: Compilar APK
        run: |
          cd lumi
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          find lumi -name "*.apk" -type f
          ls -la lumi/app/build/outputs/apk/debug/

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-H-APK
          path: lumi/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
