name: Inspeccionar Lumi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: Ver estructura
        run: |
          echo "=== CARPETAS ==="
          find lumi -type d | head -60
          echo ""
          echo "=== ARCHIVOS KOTLIN ==="
          find lumi -name "*.kt" | head -100
          echo ""
          echo "=== BUSCAR WEBTOON ==="
          find lumi -iname "*webtoon*" -o -iname "*viewer*" -o -iname "*reader*" -o -iname "*scroll*"

      - name: Buscar codigo de scroll
        run: |
          echo "=== ARCHIVOS CON autoScroll ==="
          grep -rl "autoScroll" lumi --include="*.kt" 2>/dev/null || echo "no encontrado"
          echo ""
          echo "=== ARCHIVOS CON scrollBy ==="
          grep -rl "scrollBy\|animateScroll" lumi --include="*.kt" 2>/dev/null || echo "no encontrado"
          echo ""
          echo "=== ARCHIVOS CON webtoon ==="
          grep -rl "webtoon\|Webtoon" lumi --include="*.kt" 2>/dev/null || echo "no encontrado"

      - name: Copiar archivos clave
        run: |
          mkdir -p info
          find lumi -name "*.kt" > info/lista_kotlin.txt
          find lumi -iname "*webtoon*" -exec cp {} info/ \; 2>/dev/null || true
          find lumi -iname "*viewer*" -exec cp {} info/ \; 2>/dev/null || true
          find lumi -iname "*reader*" -exec cp {} info/ \; 2>/dev/null || true
          grep -r "autoScroll\|scrollBy\|webtoon\|speed" lumi --include="*.kt" > info/codigo_scroll.txt 2>/dev/null || true
          ls -la info/

      - name: Subir informacion
        uses: actions/upload-artifact@v4
        with:
          name: info-lumi
          path: info/
          if-no-files-found: warn
