name: Ver ZoomablePage.kt

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: ZoomablePage.kt
        run: |
          echo "========== ZoomablePage.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/reader/ZoomablePage.kt"

      - name: Copiar a artifact
        run: |
          mkdir -p archivos_zoom
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/reader/ZoomablePage.kt" archivos_zoom/
          ls -la archivos_zoom/

      - name: Subir archivos
        uses: actions/upload-artifact@v4
        with:
          name: archivos-zoom
          path: archivos_zoom/
          if-no-files-found: error
