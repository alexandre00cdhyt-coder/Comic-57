          cat << 'EOF' > app/src/main/java/com/mangauniversal/app/ui/reader/ReaderViewModel.kt
          package com.mangauniversal.app.ui.reader
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import com.mangauniversal.app.domain.model.*
          import com.mangauniversal.app.domain.repository.BookRepository
          import dagger.hilt.android.lifecycle.HiltViewModel
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch
          import javax.inject.Inject
          data class ReaderUiState(
              val isLoading: Boolean = true, val title: String = "", val pages: List<Page> = emptyList(),
              val currentPage: Int = 0, val readingMode: ReadingMode = ReadingMode.HORIZONTAL_PAGED,
              val readingDirection: ReadingDirection = ReadingDirection.RIGHT_TO_LEFT, val error: String? = null
          )
          @HiltViewModel class ReaderViewModel @Inject constructor(private val bookRepository: BookRepository) : ViewModel() {
              private val _uiState = MutableStateFlow(ReaderUiState())
              val uiState: StateFlow<ReaderUiState> = _uiState.asStateFlow()
              private var currentFilePath: String = ""; private var currentBookId: String = ""
              fun loadBook(filePath: String, title: String) {
                  currentFilePath = filePath; currentBookId = filePath.hashCode().toString()
                  viewModelScope.launch {
                      _uiState.value = _uiState.value.copy(isLoading = true, title = title)
                      try {
                          val pages = bookRepository.loadPages(filePath)
                          val existingBook = bookRepository.getBook(currentBookId)
                          val initialPage = existingBook?.lastReadPage ?: 0
                          _uiState.value = _uiState.value.copy(isLoading = false, pages = pages, currentPage = initialPage, error = if (pages.isEmpty()) "Sin páginas legibles" else null)
                      } catch (e: Exception) {
                          _uiState.value = _uiState.value.copy(isLoading = false, error = e.localizedMessage ?: "Error al cargar archivo")
                      }
                  }
              }
              fun onPageChanged(newPage: Int) {
                  val state = _uiState.value
                  if (state.pages.isEmpty() || newPage == state.currentPage) return
                  _uiState.value = state.copy(currentPage = newPage)
                  viewModelScope.launch { bookRepository.saveProgress(currentBookId, state.title, currentFilePath, newPage, state.pages.size) }
              }
          }
          EOF

