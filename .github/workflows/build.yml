          package com.mangauniversal.app.ui.reader.components
          import android.graphics.Bitmap
          import androidx.compose.foundation.ExperimentalFoundationApi
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.pager.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import com.mangauniversal.app.domain.model.Page
          import com.mangauniversal.app.domain.model.ReadingDirection
          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun HorizontalReader(pages: List<Page>, initialPage: Int, direction: ReadingDirection, onPageChanged: (Int) -> Unit) {
              val pagerState = rememberPagerState(initialPage = initialPage, pageCount = { pages.size })
              LaunchedEffect(pagerState) { snapshotFlow { pagerState.currentPage }.collect { page -> onPageChanged(page) } }
              HorizontalPager(state = pagerState, reverseLayout = direction == ReadingDirection.RIGHT_TO_LEFT, modifier = Modifier.fillMaxSize()) { pageIndex ->
                  val page = pages[pageIndex]
                  val bitmapState = produceState<Bitmap?>(initialValue = null, page) { value = page.bitmapSupplier() }
                  ZoomableImage(bitmap = bitmapState.value)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mangauniversal/app/ui/reader/components/VerticalReader.kt
