name: Ver Settings y Library

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: SettingsScreen.kt
        run: |
          echo "========== SettingsScreen.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/settings/SettingsScreen.kt"

      - name: SettingsViewModel.kt
        run: |
          echo "========== SettingsViewModel.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/settings/SettingsViewModel.kt"

      - name: LibraryScreen.kt
        run: |
          echo "========== LibraryScreen.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/library/LibraryScreen.kt"

      - name: Copiar a artifact
        run: |
          mkdir -p archivos_cs
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/settings/SettingsScreen.kt" archivos_cs/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/settings/SettingsViewModel.kt" archivos_cs/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/library/LibraryScreen.kt" archivos_cs/
          ls -la archivos_cs/

      - name: Subir archivos
        uses: actions/upload-artifact@v4
        with:
          name: archivos-cs
          path: archivos_cs/
          if-no-files-found: error
