          cat << 'EOF' > app/src/main/java/com/mangauniversal/app/data/repository/BookRepositoryImpl.kt
          package com.mangauniversal.app.data.repository
          import com.mangauniversal.app.data.archive.CbzArchiveReader
          import com.mangauniversal.app.data.archive.DirectoryArchiveReader
          import com.mangauniversal.app.data.local.dao.BookDao
          import com.mangauniversal.app.data.local.dao.HistoryDao
          import com.mangauniversal.app.data.local.entity.BookEntity
          import com.mangauniversal.app.data.local.entity.HistoryEntity
          import com.mangauniversal.app.domain.model.Book
          import com.mangauniversal.app.domain.model.Page
          import com.mangauniversal.app.domain.model.ReadingDirection
          import com.mangauniversal.app.domain.model.ReadingMode
          import com.mangauniversal.app.domain.repository.BookRepository
          import kotlinx.coroutines.flow.Flow
          import javax.inject.Inject
          class BookRepositoryImpl @Inject constructor(
              private val cbzReader: CbzArchiveReader,
              private val directoryReader: DirectoryArchiveReader,
              private val bookDao: BookDao,
              private val historyDao: HistoryDao
          ) : BookRepository {
              override suspend fun loadPages(filePath: String): List<Page> {
                  return when {
                      cbzReader.isSupported(filePath) -> cbzReader.getPages(filePath)
                      directoryReader.isSupported(filePath) -> directoryReader.getPages(filePath)
                      else -> emptyList()
                  }
              }
              override suspend fun saveProgress(bookId: String, title: String, filePath: String, page: Int, totalPages: Int) {
                  val now = System.currentTimeMillis()
                  val bookEntity = BookEntity(bookId, title, filePath, totalPages, page, now, ReadingMode.HORIZONTAL_PAGED.name, ReadingDirection.RIGHT_TO_LEFT.name)
                  bookDao.insertOrUpdate(bookEntity)
                  val historyEntity = HistoryEntity(bookId, title, filePath, page, totalPages, now)
                  historyDao.insertOrUpdate(historyEntity)
              }
              override fun getHistory(): Flow<List<HistoryEntity>> = historyDao.getHistory()
              override suspend fun getBook(bookId: String): Book? {
                  val entity = bookDao.getBookById(bookId) ?: return null
                  return Book(entity.id, entity.title, entity.filePath, entity.totalPages, entity.lastReadPage, ReadingMode.valueOf(entity.readingMode), ReadingDirection.valueOf(entity.readingDirection))
              }
          }
