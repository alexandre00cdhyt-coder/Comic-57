name: Ver archivos clave de Lumi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: Mostrar WebtoonReader.kt
        run: |
          echo "========================================"
          echo "=== WebtoonReader.kt COMPLETO ==="
          echo "========================================"
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/reader/WebtoonReader.kt"

      - name: Mostrar ReaderScreen.kt
        run: |
          echo "========================================"
          echo "=== ReaderScreen.kt COMPLETO ==="
          echo "========================================"
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/reader/ReaderScreen.kt"

      - name: Mostrar ReadingMode.kt
        run: |
          echo "========================================"
          echo "=== ReadingMode.kt COMPLETO ==="
          echo "========================================"
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/model/ReadingMode.kt"

      - name: Copiar archivos a artifact
        run: |
          mkdir -p archivos_clave
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/reader/WebtoonReader.kt" archivos_clave/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/reader/ReaderScreen.kt" archivos_clave/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/model/ReadingMode.kt" archivos_clave/
          ls -la archivos_clave/

      - name: Subir archivos clave
        uses: actions/upload-artifact@v4
        with:
          name: archivos-clave-lumi
          path: archivos_clave/
          if-no-files-found: error
