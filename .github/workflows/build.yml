name: Compilar Gestor de Archivos

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Limpiar estructura
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/mangauniversal/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-anydpi-v26

      - name: settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'GestorArchivos'
          include ':app'
          EOF

      - name: build.gradle raiz
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

      - name: gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          kotlin.code.style=official
          EOF

      - name: app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mangauniversal.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mangauniversal.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'io.coil-kt:coil:2.5.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

      - name: AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.GestorArchivos"
                  tools:targetApi="34">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Gestor de Archivos</string>
          </resources>
          EOF

      - name: themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.GestorArchivos" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#1565C0</item>
                  <item name="colorPrimaryVariant">#0D47A1</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="colorSecondary">#00ACC1</item>
                  <item name="colorOnSecondary">#FFFFFF</item>
              </style>
          </resources>
          EOF

      - name: colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="azul">#1565C0</color>
              <color name="celeste">#00ACC1</color>
          </resources>
          EOF

      - name: activity_main.xml
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:id="@+id/titulo"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/app_name"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:gravity="center" />

              <Button
                  android:id="@+id/btnInterno"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:text="Ver almacenamiento interno" />

              <Button
                  android:id="@+id/btnExterno"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Ver almacenamiento externo" />

              <TextView
                  android:id="@+id/resultado"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="16dp"
                  android:padding="12dp"
                  android:background="#F0F0F0"
                  android:textSize="13sp"
                  android:scrollbars="vertical"
                  android:text="Presiona un boton para ver el contenido" />
          </LinearLayout>
          EOF

      - name: icono
        run: |
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/azul"/>
              <foreground android:drawable="@color/celeste"/>
          </adaptive-icon>
          EOF

      - name: MainActivity.kt
        run: |
          cat > app/src/main/java/com/mangauniversal/app/MainActivity.kt << 'EOF'
          package com.mangauniversal.app

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import java.io.File
          import java.text.DecimalFormat

          class MainActivity : AppCompatActivity() {

              private lateinit var resultado: TextView

              private val pedirPermiso = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { permisos ->
                  if (permisos.values.any { it }) {
                      Toast.makeText(this, "Permiso concedido", Toast.LENGTH_SHORT).show()
                  } else {
                      Toast.makeText(this, "Permiso denegado", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  resultado = findViewById(R.id.resultado)

                  findViewById<Button>(R.id.btnInterno).setOnClickListener {
                      listar(filesDir, "Almacenamiento interno")
                  }

                  findViewById<Button>(R.id.btnExterno).setOnClickListener {
                      verificarYPedirPermiso()
                  }

                  verificarPermisoInicial()
              }

              private fun verificarPermisoInicial() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          AlertDialog.Builder(this)
                              .setTitle("Permiso necesario")
                              .setMessage("Para acceder a tus archivos, acepta el permiso en la siguiente pantalla.")
                              .setPositiveButton("Dar permiso") { _, _ ->
                                  try {
                                      val i = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                                      i.data = Uri.parse("package:$packageName")
                                      startActivity(i)
                                  } catch (e: Exception) {
                                      startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                                  }
                              }
                              .setNegativeButton("Cancelar", null)
                              .show()
                      }
                  } else {
                      val permisos = mutableListOf<String>()
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                          permisos.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                          permisos.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      }
                      if (permisos.isNotEmpty()) pedirPermiso.launch(permisos.toTypedArray())
                  }
              }

              private fun verificarYPedirPermiso() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (Environment.isExternalStorageManager()) {
                          listar(Environment.getExternalStorageDirectory(), "Almacenamiento externo")
                      } else {
                          verificarPermisoInicial()
                      }
                  } else {
                      listar(Environment.getExternalStorageDirectory(), "Almacenamiento externo")
                  }
              }

              private fun listar(dir: File, titulo: String) {
                  val sb = StringBuilder()
                  sb.append("Almacenamiento: ").append(titulo).append("\n")
                  sb.append("Ruta: ").append(dir.absolutePath).append("\n\n")

                  val archivos = dir.listFiles()
                  if (archivos == null || archivos.isEmpty()) {
                      sb.append("(carpeta vacia o sin acceso)")
                  } else {
                      val ordenados = archivos.sortedWith(
                          compareByDescending<File> { it.isDirectory }.thenBy { it.name.lowercase() }
                      )
                      for (f in ordenados.take(80)) {
                          val icono = if (f.isDirectory) "[DIR]" else "[FILE]"
                          val peso = if (f.isDirectory) "" else " (" + tamanio(f.length()) + ")"
                          sb.append(icono).append(" ").append(f.name).append(peso).append("\n")
                      }
                      if (ordenados.size > 80) {
                          sb.append("\n... y ").append(ordenados.size - 80).append(" mas")
                      }
                  }

                  resultado.text = sb.toString()
              }

              private fun tamanio(bytes: Long): String {
                  if (bytes <= 0) return "0 B"
                  val u = arrayOf("B", "KB", "MB", "GB")
                  val d = (Math.log10(bytes.toDouble()) / Math.log10(1024.0)).toInt()
                  val v = bytes / Math.pow(1024.0, d.toDouble())
                  return DecimalFormat("#,##0.#").format(v) + " " + u[d]
              }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar que el APK existe
        run: |
          echo "=== Buscando APK ==="
          find . -name "*.apk" -type f
          echo "=== Contenido de app/build/outputs ==="
          ls -la app/build/outputs/apk/debug/ || true

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorArchivos-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
