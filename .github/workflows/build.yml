name: Ver detector y parser de formatos

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: Mostrar FormatDetector.kt
        run: |
          echo "========== FormatDetector.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/util/FormatDetector.kt"

      - name: Mostrar CbrParser.kt
        run: |
          echo "========== CbrParser.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/parser/CbrParser.kt"

      - name: Mostrar MediaParser.kt
        run: |
          echo "========== MediaParser.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/parser/MediaParser.kt"

      - name: Copiar a artifact
        run: |
          mkdir -p archivos_formato
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/util/FormatDetector.kt" archivos_formato/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/parser/CbrParser.kt" archivos_formato/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/parser/MediaParser.kt" archivos_formato/
          ls -la archivos_formato/

      - name: Subir archivos
        uses: actions/upload-artifact@v4
        with:
          name: archivos-formato-lumi
          path: archivos_formato/
          if-no-files-found: error
