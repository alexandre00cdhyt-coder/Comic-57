# Comic-57
name: Compilar APK Manga Universal

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el archivo APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MangaUniversal-v1.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
