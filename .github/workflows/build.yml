name: Compilar Lumi original

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a gradlew
        run: chmod +x lumi/gradlew

      - name: Ver estructura del proyecto
        run: |
          echo "=== Archivos en la raiz de lumi ==="
          ls -la lumi/
          echo ""
          echo "=== Contenido de la carpeta app ==="
          ls -la lumi/app/ 2>/dev/null || echo "No hay carpeta app"
          echo ""
          echo "=== Archivos build.gradle ==="
          find lumi -name "build.gradle*" -maxdepth 3 2>/dev/null
          echo ""
          echo "=== Version de Gradle configurada ==="
          cat lumi/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "No se encontro wrapper"

      - name: Compilar APK
        run: |
          cd lumi
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build_log.txt

      - name: Ver log completo
        if: always()
        run: |
          echo "=== Ultimas 50 lineas del log ==="
          tail -50 build_log.txt

      - name: Verificar APK
        if: always()
        run: |
          echo "=== Buscando APK ==="
          find lumi -name "*.apk" -type f 2>/dev/null || echo "No se encontro ningun APK"
          ls -la lumi/app/build/outputs/apk/debug/ 2>/dev/null || echo "No se encontro carpeta debug"

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Original-APK
          path: lumi/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Subir log de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn
