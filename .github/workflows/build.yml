name: Ver build.gradle.kts de Lumi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: Mostrar app/build.gradle.kts
        run: |
          echo "========== app/build.gradle.kts =========="
          cat "lumi/app/build.gradle.kts"

      - name: Mostrar libs.versions.toml (si existe)
        run: |
          TOML=$(find lumi -name "libs.versions.toml" | head -1)
          if [ -n "$TOML" ]; then
            echo "========== $TOML =========="
            cat "$TOML"
          else
            echo "No existe libs.versions.toml"
          fi

      - name: Copiar a artifact
        run: |
          mkdir -p archivos_gradle
          cp "lumi/app/build.gradle.kts" archivos_gradle/
          TOML=$(find lumi -name "libs.versions.toml" | head -1)
          if [ -n "$TOML" ]; then
            cp "$TOML" archivos_gradle/
          fi
          ls -la archivos_gradle/

      - name: Subir archivos
        uses: actions/upload-artifact@v4
        with:
          name: archivos-gradle
          path: archivos_gradle/
          if-no-files-found: error
