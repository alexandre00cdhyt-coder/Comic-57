          import android.graphics.Bitmap
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import com.mangauniversal.app.domain.model.Page
          @Composable fun VerticalReader(pages: List<Page>, initialPage: Int, onPageChanged: (Int) -> Unit) {
              val listState = rememberLazyListState(initialFirstVisibleItemIndex = initialPage)
              LaunchedEffect(listState) { snapshotFlow { listState.firstVisibleItemIndex }.collect { page -> onPageChanged(page) } }
              LazyColumn(state = listState, modifier = Modifier.fillMaxSize()) {
                  itemsIndexed(pages) { _, page ->
                      val bitmapState = produceState<Bitmap?>(initialValue = null, page) { value = page.bitmapSupplier() }
                      ZoomableImage(bitmap = bitmapState.value, modifier = Modifier.fillMaxWidth())
                  }
              }
