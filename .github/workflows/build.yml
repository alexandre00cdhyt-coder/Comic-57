          package com.mangauniversal.app.ui
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.runtime.Composable
          import androidx.hilt.navigation.compose.hiltViewModel
          import androidx.navigation.NavType
          import androidx.navigation.compose.*
          import androidx.navigation.navArgument
          import com.mangauniversal.app.ui.history.*
          import com.mangauniversal.app.ui.reader.*
          import com.mangauniversal.app.ui.theme.MangaUniversalTheme
          import dagger.hilt.android.AndroidEntryPoint
          import java.net.URLDecoder
          import java.net.URLEncoder
          import java.nio.charset.StandardCharsets
          @AndroidEntryPoint class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val externalUri: Uri? = intent?.data
                  setContent { MangaUniversalTheme { MangaUniversalApp(externalUri = externalUri) } }
              }
          }
          @Composable fun MangaUniversalApp(externalUri: Uri?) {
              val navController = rememberNavController()
              val startDestination = if (externalUri != null) {
                  val encodedPath = URLEncoder.encode(externalUri.toString(), StandardCharsets.UTF_8.toString())
                  val title = URLEncoder.encode(externalUri.lastPathSegment ?: "Libro", StandardCharsets.UTF_8.toString())
                  "reader?filePath=$encodedPath&title=$title"
              } else { "history" }
              NavHost(navController = navController, startDestination = startDestination) {
                  composable("history") {
                      val viewModel: HistoryViewModel = hiltViewModel()
                      HistoryScreen(viewModel = viewModel, onBookClick = { path, title ->
                          val encodedPath = URLEncoder.encode(path, StandardCharsets.UTF_8.toString())
                          val encodedTitle = URLEncoder.encode(title, StandardCharsets.UTF_8.toString())
                          navController.navigate("reader?filePath=$encodedPath&title=$encodedTitle")
                      })
                  }
                  composable(route = "reader?filePath={filePath}&title={title}", arguments = listOf(navArgument("filePath") { type = NavType.StringType }, navArgument("title") { type = NavType.StringType })) { backStackEntry ->
                      val encodedPath = backStackEntry.arguments?.getString("filePath") ?: ""
                      val encodedTitle = backStackEntry.arguments?.getString("title") ?: ""
                      val filePath = URLDecoder.decode(encodedPath, StandardCharsets.UTF_8.toString())
                      val title = URLDecoder.decode(encodedTitle, StandardCharsets.UTF_8.toString())
                      val viewModel: ReaderViewModel = hiltViewModel()
                      ReaderScreen(filePath = filePath, title = title, viewModel = viewModel)
                  }
              }
          }
          EOF

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MangaUniversal-v1.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
