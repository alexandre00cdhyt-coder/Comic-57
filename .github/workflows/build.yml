name: Compilar Gestor de Archivos

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Limpiar estructura
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/mangauniversal/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-anydpi-v26

      - name: settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'GestorArchivos'
          include ':app'
          EOF

      - name: build.gradle raiz
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

      - name: gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

      - name: app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mangauniversal.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mangauniversal.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName '1.0.3'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'io.coil-kt:coil:2.5.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.GestorArchivos"
                  tools:targetApi="34">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Gestor de Archivos</string>
          </resources>
          EOF

      - name: themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.GestorArchivos" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">#1565C0</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="colorSecondary">#00ACC1</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>
          EOF

      - name: colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="azul">#1565C0</color>
              <color name="ic_launcher_background">#1565C0</color>
              <color name="ic_launcher_foreground">#FFFFFF</color>
          </resources>
          EOF

      - name: icono mipmap
        run: |
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@color/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

      - name: activity_main.xml
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp"
              android:background="#FFFFFF">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/app_name"
                  android:textColor="#1565C0"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:gravity="center"
                  android:paddingBottom="16dp" />

              <Button
                  android:id="@+id/btnInterno"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Ver almacenamiento interno" />

              <Button
                  android:id="@+id/btnExterno"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Ver almacenamiento externo" />

              <Button
                  android:id="@+id/btnInfo"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Informacion del sistema" />

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="16dp">

                  <TextView
                      android:id="@+id/resultado"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:padding="12dp"
                      android:background="#F0F0F0"
                      android:textSize="13sp"
                      android:textColor="#212121"
                      android:text="Presiona un boton" />
              </ScrollView>
          </LinearLayout>
          EOF

      - name: MainActivity.kt
        run: |
          cat > app/src/main/java/com/mangauniversal/app/MainActivity.kt << 'EOF'
          package com.mangauniversal.app

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import java.io.File
          import java.text.DecimalFormat

          class MainActivity : AppCompatActivity() {

              private lateinit var resultado: TextView

              private val pedirPermiso = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { permisos ->
                  if (permisos.values.any { it }) {
                      Toast.makeText(this, "Permiso concedido", Toast.LENGTH_SHORT).show()
                  } else {
                      Toast.makeText(this, "Permiso denegado", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  try {
                      setContentView(R.layout.activity_main)

                      resultado = findViewById(R.id.resultado)
                      resultado.text = "App iniciada correctamente.\nAndroid ${Build.VERSION.RELEASE}\nAPI ${Build.VERSION.SDK_INT}"

                      findViewById<Button>(R.id.btnInterno).setOnClickListener {
                          try { listar(filesDir, "Almacenamiento interno") }
                          catch (e: Exception) { resultado.text = "Error: ${e.message}" }
                      }

                      findViewById<Button>(R.id.btnExterno).setOnClickListener {
                          try { verificarYPedirPermiso() }
                          catch (e: Exception) { resultado.text = "Error: ${e.message}" }
                      }

                      findViewById<Button>(R.id.btnInfo).setOnClickListener {
                          try { infoSistema() }
                          catch (e: Exception) { resultado.text = "Error: ${e.message}" }
                      }

                  } catch (e: Exception) {
                      val tv = TextView(this)
                      tv.text = "ERROR AL INICIAR:\n${e.message}"
                      tv.textSize = 14f
                      setContentView(tv)
                  }
              }

              private fun infoSistema() {
                  val sb = StringBuilder()
                  sb.append("=== Sistema ===\n")
                  sb.append("Android: ").append(Build.VERSION.RELEASE).append("\n")
                  sb.append("API: ").append(Build.VERSION.SDK_INT).append("\n")
                  sb.append("Fabricante: ").append(Build.MANUFACTURER).append("\n")
                  sb.append("Modelo: ").append(Build.MODEL).append("\n\n")
                  sb.append("=== Almacenamiento ===\n")
                  val raiz = Environment.getExternalStorageDirectory()
                  sb.append("Ruta: ").append(raiz.absolutePath).append("\n")
                  sb.append("Existe: ").append(raiz.exists()).append("\n")
                  sb.append("Puede leer: ").append(raiz.canRead()).append("\n")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      sb.append("MANAGE_EXTERNAL_STORAGE: ")
                          .append(Environment.isExternalStorageManager()).append("\n")
                  }
                  resultado.text = sb.toString()
              }

              private fun verificarYPedirPermiso() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (Environment.isExternalStorageManager()) {
                          listar(Environment.getExternalStorageDirectory(), "Externo")
                      } else {
                          try {
                              val i = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                              i.data = Uri.parse("package:$packageName")
                              startActivity(i)
                          } catch (e: Exception) {
                              try {
                                  startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                              } catch (e2: Exception) {
                                  resultado.text = "No se pudo abrir ajustes"
                              }
                          }
                      }
                  } else {
                      val permisos = mutableListOf<String>()
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                          permisos.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                          permisos.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      }
                      if (permisos.isEmpty()) {
                          listar(Environment.getExternalStorageDirectory(), "Externo")
                      } else {
                          pedirPermiso.launch(permisos.toTypedArray())
                      }
                  }
              }

              private fun listar(dir: File, titulo: String) {
                  val sb = StringBuilder()
                  sb.append("[").append(titulo).append("]\n")
                  sb.append("Ruta: ").append(dir.absolutePath).append("\n\n")

                  val archivos = dir.listFiles()
                  if (archivos == null || archivos.isEmpty()) {
                      sb.append("(carpeta vacia o sin acceso)")
                  } else {
                      val ordenados = archivos.sortedWith(
                          compareByDescending<File> { it.isDirectory }.thenBy { it.name.lowercase() }
                      )
                      for (f in ordenados.take(80)) {
                          val icono = if (f.isDirectory) "[DIR]" else "[FILE]"
                          val peso = if (f.isDirectory) "" else " (" + tamanio(f.length()) + ")"
                          sb.append(icono).append(" ").append(f.name).append(peso).append("\n")
                      }
                  }
                  resultado.text = sb.toString()
              }

              private fun tamanio(bytes: Long): String {
                  if (bytes <= 0) return "0 B"
                  val u = arrayOf("B", "KB", "MB", "GB")
                  val d = (Math.log10(bytes.toDouble()) / Math.log10(1024.0)).toInt()
                  val v = bytes / Math.pow(1024.0, d.toDouble())
                  return DecimalFormat("#,##0.#").format(v) + " " + u[d]
              }
          }
          EOF

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          echo "=== APK generado ==="
          find . -name "*.apk" -type f
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No se creo la carpeta debug"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorArchivos-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
