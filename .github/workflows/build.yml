name: Compilar Lumi v8-lite

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a gradlew
        run: chmod +x lumi/gradlew

      - name: Anadir coil-gif al version catalog
        run: |
          TOML="lumi/gradle/libs.versions.toml"
          if [ -f "$TOML" ]; then
            if ! grep -q "coil-gif" "$TOML"; then
              sed -i 's|coil-compose = .*|&\ncoil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coil" }|' "$TOML"
            fi
          fi

      - name: Anadir coil-gif al app/build.gradle.kts
        run: |
          GRADLE="lumi/app/build.gradle.kts"
          if ! grep -q "coil.gif" "$GRADLE"; then
            sed -i 's|implementation(libs.coil.compose)|&\n    implementation(libs.coil.gif)|' "$GRADLE"
          fi

      - name: Modificar AndroidManifest.xml (rotacion)
        run: |
          MANIFEST=$(find lumi -name "AndroidManifest.xml" -path "*/main/*" | head -1)
          if ! grep -q "configChanges" "$MANIFEST"; then
            sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:configChanges="orientation\|screenSize\|keyboardHidden\|screenLayout\|smallestScreenSize"|' "$MANIFEST"
          fi

      - name: LumiApplication.kt
        run: |
          cat > "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/LumiApplication.kt" << 'KOTLIN_EOF'
          package io.github.amiigood.lumi.lumi

          import android.app.Application
          import android.os.Build
          import coil.ImageLoader
          import coil.ImageLoaderFactory
          import coil.decode.GifDecoder
          import coil.decode.ImageDecoderDecoder
          import dagger.hilt.android.HiltAndroidApp

          @HiltAndroidApp
          class LumiApplication : Application(), ImageLoaderFactory {
              override fun newImageLoader(): ImageLoader {
                  return ImageLoader.Builder(this)
                      .crossfade(false)
                      .components {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              add(ImageDecoderDecoder.Factory())
                          } else {
                              add(GifDecoder.Factory())
                          }
                      }
                      .build()
              }
          }
          KOTLIN_EOF

      - name: MediaItem.kt
        run: |
          cat > "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/model/MediaItem.kt" << 'KOTLIN_EOF'
          package io.github.amiigood.lumi.lumi.data.model

          data class MediaItem(
              val id: String,
              val title: String,
              val author: String?,
              val coverPath: String?,
              val filePath: String,
              val format: MediaFormat,
              val type: MediaType,
              val collection: String?,
              val pageCount: Int,
              val currentPage: Int = 0,
              val lastReadAt: Long? = null,
              val addedAt: Long,
              val metadata: ItemMetadata = ItemMetadata()
          )

          data class ItemMetadata(
              val series: String? = null,
              val number: String? = null,
              val volume: String? = null,
              val summary: String? = null,
              val publisher: String? = null,
              val year: Int? = null,
              val genres: List<String> = emptyList(),
              val language: String? = null,
              val isbn: String? = null,
              val writer: String? = null,
              val artist: String? = null
          )

          enum class MediaFormat {
              CBZ, CBR, EPUB, PDF, IMAGE_FOLDER
          }

          enum class MediaType {
              MANGA, COMIC, BOOK, UNKNOWN
          }
          KOTLIN_EOF

      - name: FormatDetector.kt
        run: |
          cat > "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/util/FormatDetector.kt" << 'KOTLIN_EOF'
          package io.github.amiigood.lumi.lumi.util

          import io.github.amiigood.lumi.lumi.data.model.MediaFormat
          import io.github.amiigood.lumi.lumi.data.model.MediaType

          object FormatDetector {
              val imageExtensions = listOf(
                  ".jpg", ".jpeg", ".png", ".gif", ".webp",
                  ".bmp", ".avif", ".heic", ".heif", ".tiff", ".tif"
              )
              fun isImageFile(fileName: String?): Boolean {
                  if (fileName.isNullOrEmpty()) return false
                  val lower = fileName.lowercase()
                  return imageExtensions.any { lower.endsWith(it) }
              }
              fun detectFormat(fileName: String): MediaFormat? {
                  val lower = fileName.lowercase()
                  return when {
                      lower.endsWith(".cbz") -> MediaFormat.CBZ
                      lower.endsWith(".cbr") -> MediaFormat.CBR
                      lower.endsWith(".zip") -> MediaFormat.CBZ
                      lower.endsWith(".rar") -> MediaFormat.CBR
                      lower.endsWith(".epub") -> MediaFormat.EPUB
                      lower.endsWith(".pdf") -> MediaFormat.PDF
                      else -> null
                  }
              }
              fun inferTypeFromPath(parentFolders: List<String>, format: MediaFormat): MediaType {
                  val joined = parentFolders.joinToString("/").lowercase()
                  return when {
                      joined.contains("manga") -> MediaType.MANGA
                      joined.contains("comic") -> MediaType.COMIC
                      joined.contains("manhwa") -> MediaType.MANGA
                      joined.contains("manhua") -> MediaType.MANGA
                      joined.contains("libro") || joined.contains("book") -> MediaType.BOOK
                      format == MediaFormat.EPUB -> MediaType.BOOK
                      format == MediaFormat.CBZ || format == MediaFormat.CBR -> MediaType.COMIC
                      else -> MediaType.UNKNOWN
                  }
              }
          }
          KOTLIN_EOF

      - name: LibraryScanner.kt
        run: |
          cat > "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/scanner/LibraryScanner.kt" << 'KOTLIN_EOF'
          package io.github.amiigood.lumi.lumi.data.scanner

          import android.content.Context
          import android.net.Uri
          import androidx.documentfile.provider.DocumentFile
          import io.github.amiigood.lumi.lumi.data.model.MediaFormat
          import io.github.amiigood.lumi.lumi.data.model.MediaItem
          import io.github.amiigood.lumi.lumi.data.parser.CbrParser
          import io.github.amiigood.lumi.lumi.data.parser.CbzParser
          import io.github.amiigood.lumi.lumi.data.parser.EpubParser
          import io.github.amiigood.lumi.lumi.data.parser.MediaParser
          import io.github.amiigood.lumi.lumi.data.parser.PdfParser
          import io.github.amiigood.lumi.lumi.util.FormatDetector
          import dagger.hilt.android.qualifiers.ApplicationContext
          import io.github.amiigood.lumi.lumi.data.model.ItemMetadata
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.security.MessageDigest
          import javax.inject.Inject
          import javax.inject.Singleton
          import kotlinx.coroutines.ensureActive
          import kotlin.coroutines.coroutineContext

          private data class ScannedFile(
              val docFile: DocumentFile,
              val format: MediaFormat,
              val parentFolders: List<String>
          )
          private data class ScannedFolder(
              val docFolder: DocumentFile,
              val imageCount: Int,
              val parentFolders: List<String>
          )

          @Singleton
          class LibraryScanner @Inject constructor(
              @ApplicationContext private val context: Context,
              private val cbzParser: CbzParser,
              private val cbrParser: CbrParser,
              private val epubParser: EpubParser,
              private val pdfParser: PdfParser
          ) {
              suspend fun scan(rootUri: Uri): List<MediaItem> = withContext(Dispatchers.IO) {
                  val root = DocumentFile.fromTreeUri(context, rootUri) ?: return@withContext emptyList()
                  val scannedFiles = mutableListOf<ScannedFile>()
                  val scannedFolders = mutableListOf<ScannedFolder>()
                  walk(root, emptyList(), scannedFiles, scannedFolders)
                  val itemsFromFiles = scannedFiles.map { it.toMediaItem() }
                  val itemsFromFolders = scannedFolders.map { it.toFolderMediaItem() }
                  itemsFromFiles + itemsFromFolders
              }
              private suspend fun walk(
                  dir: DocumentFile,
                  parents: List<String>,
                  filesOut: MutableList<ScannedFile>,
                  foldersOut: MutableList<ScannedFolder>
              ) {
                  coroutineContext.ensureActive()
                  val children = dir.listFiles()
                  var imageCount = 0
                  for (child in children) {
                      coroutineContext.ensureActive()
                      when {
                          child.isDirectory -> {
                              val newParents = parents + (child.name ?: "")
                              walk(child, newParents, filesOut, foldersOut)
                          }
                          child.isFile -> {
                              val name = child.name
                              val mime = child.type
                              val esImagen = FormatDetector.isImageFile(name) ||
                                             (mime != null && mime.startsWith("image/"))
                              if (esImagen) imageCount++
                              if (name == null) continue
                              val format = FormatDetector.detectFormat(name) ?: continue
                              filesOut.add(ScannedFile(child, format, parents))
                          }
                      }
                  }
                  if (imageCount > 0 && parents.isNotEmpty()) {
                      foldersOut.add(ScannedFolder(dir, imageCount, parents))
                  }
              }
              private suspend fun ScannedFile.toMediaItem(): MediaItem {
                  coroutineContext.ensureActive()
                  val name = docFile.name ?: "Untitled"
                  val fallbackTitle = name.substringBeforeLast('.')
                  val type = FormatDetector.inferTypeFromPath(parentFolders, format)
                  val parser: MediaParser = when (format) {
                      MediaFormat.CBZ -> cbzParser
                      MediaFormat.CBR -> cbrParser
                      MediaFormat.EPUB -> epubParser
                      MediaFormat.PDF -> pdfParser
                      MediaFormat.IMAGE_FOLDER -> cbzParser
                  }
                  val parsed = runCatching { parser.extractMetadata(docFile.uri) }.getOrNull()
                  val collection = parsed?.extra?.series ?: parentFolders.lastOrNull()
                  return MediaItem(
                      id = hashId(docFile.uri.toString()),
                      title = parsed?.title ?: fallbackTitle,
                      author = parsed?.author,
                      coverPath = null,
                      filePath = docFile.uri.toString(),
                      format = format,
                      type = type,
                      collection = collection,
                      pageCount = parsed?.pageCount ?: 0,
                      currentPage = 0,
                      lastReadAt = null,
                      addedAt = System.currentTimeMillis(),
                      metadata = parsed?.extra ?: ItemMetadata()
                  )
              }
              private suspend fun ScannedFolder.toFolderMediaItem(): MediaItem {
                  coroutineContext.ensureActive()
                  val folderName = docFolder.name ?: "Carpeta"
                  val type = FormatDetector.inferTypeFromPath(parentFolders, MediaFormat.IMAGE_FOLDER)
                  val collection = parentFolders.lastOrNull()
                  return MediaItem(
                      id = hashId(docFolder.uri.toString()),
                      title = folderName,
                      author = null,
                      coverPath = null,
                      filePath = docFolder.uri.toString(),
                      format = MediaFormat.IMAGE_FOLDER,
                      type = type,
                      collection = collection,
                      pageCount = imageCount,
                      currentPage = 0,
                      lastReadAt = null,
                      addedAt = System.currentTimeMillis(),
                      metadata = ItemMetadata()
                  )
              }
              private fun hashId(input: String): String {
                  val bytes = MessageDigest.getInstance("SHA-1").digest(input.toByteArray())
                  return bytes.joinToString("") { "%02x".format(it) }.take(16)
              }
          }
          KOTLIN_EOF

      - name: PageExtractor.kt
        run: |
          cat > "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/reader/PageExtractor.kt" << 'KOTLIN_EOF'
          package io.github.amiigood.lumi.lumi.data.reader

          import android.content.Context
          import android.net.Uri
          import androidx.documentfile.provider.DocumentFile
          import com.github.junrar.Archive
          import io.github.amiigood.lumi.lumi.data.model.MediaFormat
          import dagger.hilt.android.qualifiers.ApplicationContext
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.util.zip.ZipInputStream
          import javax.inject.Inject
          import javax.inject.Singleton

          @Singleton
          class PageExtractor @Inject constructor(
              @ApplicationContext private val context: Context
          ) {
              private val imageExtensions = listOf(
                  ".jpg", ".jpeg", ".png", ".gif", ".webp",
                  ".bmp", ".avif", ".heic", ".heif", ".tiff", ".tif"
              )
              private val pagesRoot: File by lazy {
                  File(context.cacheDir, "pages").apply { mkdirs() }
              }
              suspend fun extractImagePages(itemId: String, uri: Uri, format: MediaFormat): List<File> = withContext(Dispatchers.IO) {
                  val target = File(pagesRoot, itemId)
                  if (target.exists() && target.listFiles()?.isNotEmpty() == true) {
                      return@withContext target.listFiles()!!
                          .filter { it.isFile }
                          .sortedWith(naturalOrderFile())
                  }
                  target.mkdirs()
                  try {
                      when (format) {
                          MediaFormat.CBZ -> extractCbz(uri, target)
                          MediaFormat.CBR -> extractCbr(uri, target)
                          MediaFormat.IMAGE_FOLDER -> extractFolder(uri, target)
                          else -> emptyList()
                      }
                  } catch (e: UnsupportedRarException) {
                      target.deleteRecursively()
                      throw e
                  } catch (e: Exception) {
                      target.deleteRecursively()
                      emptyList()
                  }
              }
              private fun extractFolder(uri: Uri, target: File): List<File> {
                  val docFolder = DocumentFile.fromTreeUri(context, uri)
                      ?: DocumentFile.fromSingleUri(context, uri)
                      ?: return emptyList()
                  val files = mutableListOf<File>()
                  val children = docFolder.listFiles()
                  var index = 0
                  for (child in children) {
                      if (!child.isFile) continue
                      val name = child.name
                      val mime = child.type
                      val esImagen = (name != null && name.isImage()) ||
                                     (mime != null && mime.startsWith("image/"))
                      if (!esImagen) continue
                      index++
                      val extension = when {
                          name != null && name.contains(".") -> name.substringAfterLast('.')
                          mime == "image/webp" -> "webp"
                          mime == "image/gif" -> "gif"
                          mime == "image/png" -> "png"
                          mime == "image/jpeg" -> "jpg"
                          else -> "jpg"
                      }
                      val safeName = String.format("%05d.%s", index, extension)
                      val out = File(target, safeName)
                      try {
                          context.contentResolver.openInputStream(child.uri)?.use { input ->
                              out.outputStream().use { fos -> input.copyTo(fos) }
                          }
                          if (out.exists() && out.length() > 0) files.add(out)
                      } catch (e: Exception) {}
                  }
                  return files.sortedWith(naturalOrderFile())
              }
              private fun extractCbz(uri: Uri, target: File): List<File> {
                  val files = mutableListOf<File>()
                  context.contentResolver.openInputStream(uri)?.use { input ->
                      ZipInputStream(input).use { zip ->
                          var entry = zip.nextEntry
                          while (entry != null) {
                              if (!entry.isDirectory && entry.name.isImage()) {
                                  val safeName = entry.name.replace('/', '_').replace('\\', '_')
                                  val out = File(target, safeName)
                                  out.outputStream().use { fos -> zip.copyTo(fos) }
                                  files.add(out)
                              }
                              entry = zip.nextEntry
                          }
                      }
                  }
                  return files.sortedWith(naturalOrderFile())
              }
              private fun extractCbr(uri: Uri, target: File): List<File> {
                  val temp = File.createTempFile("cbr_", ".rar", context.cacheDir)
                  try {
                      context.contentResolver.openInputStream(uri)?.use { input ->
                          temp.outputStream().use { out -> input.copyTo(out) }
                      } ?: return emptyList()
                      if (isRar5(temp)) throw UnsupportedRarException()
                      val files = mutableListOf<File>()
                      Archive(temp).use { archive ->
                          archive.fileHeaders
                              .filter { !it.isDirectory && it.fileName.isImage() }
                              .forEach { header ->
                                  val safeName = header.fileName.replace('/', '_').replace('\\', '_')
                                  val out = File(target, safeName)
                                  out.outputStream().use { fos -> archive.extractFile(header, fos) }
                                  files.add(out)
                              }
                      }
                
