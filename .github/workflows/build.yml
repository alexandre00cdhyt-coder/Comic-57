      - name: ArchivoUtil.kt
        run: |
          cat > app/src/main/java/com/mangauniversal/app/ArchivoUtil.kt << 'EOF'
          package com.mangauniversal.app

          import android.content.Context
          import android.net.Uri
          import android.os.Environment
          import java.io.File
          import java.text.DecimalFormat

          object ArchivoUtil {

              fun dirInterno(context: Context): File = context.filesDir

              fun dirExterno(): File = Environment.getExternalStorageDirectory()

              fun tamanioLegible(bytes: Long): String {
                  if (bytes <= 0) return "0 B"
                  val unidades = arrayOf("B", "KB", "MB", "GB", "TB")
                  val digito = (Math.log10(bytes.toDouble()) / Math.log10(1024.0)).toInt()
                  val valor = bytes / Math.pow(1024.0, digito.toDouble())
                  return DecimalFormat("#,##0.#").format(valor) + " " + unidades[digito]
              }

              fun esImagen(nombre: String): Boolean {
                  val ext = nombre.substringAfterLast('.', "").lowercase()
                  return ext in listOf("jpg", "jpeg", "png", "gif", "webp", "bmp", "heic")
              }

              fun esVideo(nombre: String): Boolean {
                  val ext = nombre.substringAfterLast('.', "").lowercase()
                  return ext in listOf("mp4", "mkv", "avi", "mov", "webm", "3gp")
              }

              fun esAudio(nombre: String): Boolean {
                  val ext = nombre.substringAfterLast('.', "").lowercase()
                  return ext in listOf("mp3", "wav", "ogg", "m4a", "flac", "aac")
              }

              fun esDocumento(nombre: String): Boolean {
                  val ext = nombre.substringAfterLast('.', "").lowercase()
                  return ext in listOf("pdf", "doc", "docx", "txt", "xls", "xlsx", "ppt", "pptx", "epub")
              }

              fun eliminar(archivo: File): Boolean {
                  return try {
                      if (archivo.isDirectory) archivo.deleteRecursively()
                      else archivo.delete()
                  } catch (e: Exception) {
                      false
                  }
              }

              fun copiar(origen: File, destino: File): Boolean {
                  return try {
                      if (origen.isDirectory) {
                          destino.mkdirs()
                          origen.listFiles()?.forEach { hijo ->
                              copiar(hijo, File(destino, hijo.name))
                          }
                          true
                      } else {
                          destino.parentFile?.mkdirs()
                          origen.inputStream().use { entrada ->
                              destino.outputStream().use { salida ->
                                  entrada.copyTo(salida)
                              }
                          }
                          true
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              fun mover(origen: File, destino: File): Boolean {
                  return try {
                      if (origen.renameTo(destino)) true
                      else {
                          if (copiar(origen, destino)) {
                              eliminar(origen)
                          } else false
                      }
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          EOF

      - name: ArchivoAdapter.kt
        run: |
          cat > app/src/main/java/com/mangauniversal/app/ArchivoAdapter.kt << 'EOF'
          package com.mangauniversal.app

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import java.io.File

          class ArchivoAdapter(
              private val archivos: MutableList<File>,
              private val onClick: (File) -> Unit,
              private val onMenu: (File, View) -> Unit
          ) : RecyclerView.Adapter<ArchivoAdapter.Vista>() {

              class Vista(v: View) : RecyclerView.ViewHolder(v) {
                  val icono: ImageView = v.findViewById(R.id.icono)
                  val nombre: TextView = v.findViewById(R.id.nombre)
                  val detalle: TextView = v.findViewById(R.id.detalle)
                  val menu: TextView = v.findViewById(R.id.menuPuntos)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): Vista {
                  val v = LayoutInflater.from(parent.context)
                      .inflate(R.layout.item_archivo, parent, false)
                  return Vista(v)
              }

              override fun onBindViewHolder(holder: Vista, position: Int) {
                  val f = archivos[position]
                  holder.nombre.text = f.name
                  holder.detalle.text = if (f.isDirectory) {
                      "Carpeta"
                  } else {
                      ArchivoUtil.tamanioLegible(f.length())
                  }

                  holder.icono.setImageResource(
                      when {
                          f.isDirectory -> android.R.drawable.ic_menu_directions
                          ArchivoUtil.esImagen(f.name) -> android.R.drawable.ic_menu_gallery
                          ArchivoUtil.esVideo(f.name) -> android.R.drawable.ic_menu_slideshow
                          ArchivoUtil.esAudio(f.name) -> android.R.drawable.ic_lock_silent_mode_off
                          else -> android.R.drawable.ic_menu_agenda
                      }
                  )

                  holder.itemView.setOnClickListener { onClick(f) }
                  holder.menu.setOnClickListener { v -> onMenu(f, v) }
              }

              override fun getItemCount(): Int = archivos.size
          }
          EOF

      - name: ImagenAdapter.kt
        run: |
          cat > app/src/main/java/com/mangauniversal/app/ImagenAdapter.kt << 'EOF'
          package com.mangauniversal.app

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import coil.load
          import java.io.File

          class ImagenAdapter(
              private val imagenes: List<File>,
              private val onClick: (File) -> Unit
          ) : RecyclerView.Adapter<ImagenAdapter.Vista>() {

              class Vista(v: View) : RecyclerView.ViewHolder(v) {
                  val imagen: ImageView = v.findViewById(R.id.imagen)
                  val nombre: TextView = v.findViewById(R.id.nombreImagen)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): Vista {
                  val v = LayoutInflater.from(parent.context)
                      .inflate(R.layout.item_imagen, parent, false)
                  return Vista(v)
              }

              override fun onBindViewHolder(holder: Vista, position: Int) {
                  val f = imagenes[position]
                  holder.imagen.load(f) {
                      crossfade(true)
                  }
                  holder.nombre.text = f.name
                  holder.itemView.setOnClickListener { onClick(f) }
              }

              override fun getItemCount(): Int = imagenes.size
          }
          EOF

      - name: VisorActivity.kt
        run: |
          cat > app/src/main/java/com/mangauniversal/app/VisorActivity.kt << 'EOF'
          package com.mangauniversal.app

          import android.os.Bundle
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import coil.load
          import java.io.File

          class VisorActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_visor)

                  val ruta = intent.getStringExtra("ruta") ?: return
                  val archivo = File(ruta)

                  val imagen: ImageView = findViewById(R.id.imagenGrande)
                  val nombre: TextView = findViewById(R.id.nombreVisor)
                  val boton: Button = findViewById(R.id.btnCerrar)

                  nombre.text = archivo.name
                  imagen.load(archivo) {
                      crossfade(true)
                  }

                  boton.setOnClickListener { finish() }
              }
          }
