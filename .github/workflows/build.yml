name: Ver Application y AppModule

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: LumiApplication.kt
        run: |
          echo "========== LumiApplication.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/LumiApplication.kt"

      - name: AppModule.kt
        run: |
          echo "========== AppModule.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/AppModule.kt"

      - name: LumiPreferences.kt
        run: |
          echo "========== LumiPreferences.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/local/LumiPreferences.kt"

      - name: Copiar a artifact
        run: |
          mkdir -p archivos_app
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/LumiApplication.kt" archivos_app/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/AppModule.kt" archivos_app/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/local/LumiPreferences.kt" archivos_app/
          ls -la archivos_app/

      - name: Subir archivos
        uses: actions/upload-artifact@v4
        with:
          name: archivos-app
          path: archivos_app/
          if-no-files-found: error
