name: Compilar APK Manga Universal

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Crear Estructura de Directorios
        run: |
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/mangauniversal/app

      - name: Crear settings.gradle
        run: |
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'MangaUniversal'" >> settings.gradle
          echo "include ':app'" >> settings.gradle

      - name: Crear build.gradle Raíz
        run: |
          echo "plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.20' apply false }" > build.gradle

      - name: Crear app/build.gradle
        run: |
          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }" > app/build.gradle
          echo "android { namespace 'com.mangauniversal.app'; compileSdk 34; defaultConfig { applicationId 'com.mangauniversal.app'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0.0' }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }" >> app/build.gradle

      - name: Crear AndroidManifest.xml
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' >> app/src/main/AndroidManifest.xml
          echo '    <application android:allowBackup="true" android:label="Manga Universal" android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">' >> app/src/main/AndroidManifest.xml
          echo '        <activity android:name=".MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '        </activity>' >> app/src/main/AndroidManifest.xml
          echo '    </application>' >> app/src/main/AndroidManifest.xml
          echo '</manifest>' >> app/src/main/AndroidManifest.xml

      - name: Crear MainActivity.kt
        run: |
          echo 'package com.mangauniversal.app' > app/src/main/java/com/mangauniversal/app/MainActivity.kt
          echo 'import android.os.Bundle' >> app/src/main/java/com/mangauniversal/app/MainActivity.kt
          echo 'import androidx.appcompat.app.AppCompatActivity' >> app/src/main/java/com/mangauniversal/app/MainActivity.kt
          echo 'class MainActivity : AppCompatActivity() {' >> app/src/main/java/com/mangauniversal/app/MainActivity.kt
          echo '    override fun onCreate(savedInstanceState: Bundle?) {' >> app/src/main/java/com/mangauniversal/app/MainActivity.kt
          echo '        super.onCreate(savedInstanceState)' >> app/src/main/java/com/mangauniversal/app/MainActivity.kt
          echo '    }' >> app/src/main/java/com/mangauniversal/app/MainActivity.kt
          echo '}' >> app/src/main/java/com/mangauniversal/app/MainActivity.kt

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaUniversal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
