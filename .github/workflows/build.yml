          package io.github.amiigood.lumi.lumi.data.local

          import android.content.Context
          import androidx.datastore.preferences.core.booleanPreferencesKey
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.intPreferencesKey
          import androidx.datastore.preferences.core.longPreferencesKey
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import io.github.amiigood.lumi.lumi.data.model.ReadingMode
          import dagger.hilt.android.qualifiers.ApplicationContext
          import io.github.amiigood.lumi.lumi.data.model.ThemeMode
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import javax.inject.Inject
          import javax.inject.Singleton

          private val Context.dataStore by preferencesDataStore(name = "lumi_prefs")

          @Singleton
          class LumiPreferences @Inject constructor(
              @ApplicationContext private val context: Context
          ) {
              private val rootFolderKey = stringPreferencesKey("root_folder_uri")
              private val onboardingDoneKey = booleanPreferencesKey("onboarding_done")
              private val themeModeKey = stringPreferencesKey("theme_mode")
              private val readerTutorialDoneKey = booleanPreferencesKey("reader_tutorial_done")
              private val readingModePrefix = "reading_mode_"
              private val progressPrefix = "progress_"
              private val totalPagesPrefix = "totalpages_"
              private val epubFontSizeKey = intPreferencesKey("epub_font_size")
              private val epubDarkModeKey = booleanPreferencesKey("epub_dark_mode")
              private val dynamicColorKey = booleanPreferencesKey("dynamic_color")
              private val lastReadPrefix = "lastread_"

              // NUEVAS
              private val showStatusbarKey = booleanPreferencesKey("show_statusbar")
              private val resumeReadingKey = booleanPreferencesKey("resume_reading")
              private val keepScreenOnKey = booleanPreferencesKey("keep_screen_on")
              private val rightToLeftKey = booleanPreferencesKey("right_to_left")
              private val showFolderPathKey = booleanPreferencesKey("show_folder_path")
              private val leftScrollbarKey = booleanPreferencesKey("left_scrollbar")
              private val zipCacheRetentionKey = intPreferencesKey("zip_cache_retention_days")

              val showStatusbar: Flow<Boolean> = context.dataStore.data.map { it[showStatusbarKey] ?: true }
              val resumeReading: Flow<Boolean> = context.dataStore.data.map { it[resumeReadingKey] ?: true }
              val keepScreenOn: Flow<Boolean> = context.dataStore.data.map { it[keepScreenOnKey] ?: true }
              val rightToLeft: Flow<Boolean> = context.dataStore.data.map { it[rightToLeftKey] ?: false }
              val showFolderPath: Flow<Boolean> = context.dataStore.data.map { it[showFolderPathKey] ?: false }
              val leftScrollbar: Flow<Boolean> = context.dataStore.data.map { it[leftScrollbarKey] ?: false }
              val zipCacheRetention: Flow<Int> = context.dataStore.data.map { it[zipCacheRetentionKey] ?: 20 }

              suspend fun setShowStatusbar(v: Boolean) { context.dataStore.edit { it[showStatusbarKey] = v } }
              suspend fun setResumeReading(v: Boolean) { context.dataStore.edit { it[resumeReadingKey] = v } }
              suspend fun setKeepScreenOn(v: Boolean) { context.dataStore.edit { it[keepScreenOnKey] = v } }
              suspend fun setRightToLeft(v: Boolean) { context.dataStore.edit { it[rightToLeftKey] = v } }
              suspend fun setShowFolderPath(v: Boolean) { context.dataStore.edit { it[showFolderPathKey] = v } }
              suspend fun setLeftScrollbar(v: Boolean) { context.dataStore.edit { it[leftScrollbarKey] = v } }
              suspend fun setZipCacheRetention(days: Int) { context.dataStore.edit { it[zipCacheRetentionKey] = days } }

              val rootFolderUri: Flow<String?> = context.dataStore.data.map { it[rootFolderKey] }
              val onboardingDone: Flow<Boolean> = context.dataStore.data.map { it[onboardingDoneKey] ?: false }
              val readerTutorialDone: Flow<Boolean> = context.dataStore.data.map { it[readerTutorialDoneKey] ?: false }
              val epubFontSize: Flow<Int> = context.dataStore.data.map { it[epubFontSizeKey] ?: 18 }
              val epubDarkMode: Flow<Boolean> = context.dataStore.data.map { it[epubDarkModeKey] ?: false }
              val dynamicColor: Flow<Boolean> = context.dataStore.data.map { it[dynamicColorKey] ?: false }

              suspend fun setRootFolderUri(uri: String) { context.dataStore.edit { it[rootFolderKey] = uri } }
              suspend fun setOnboardingDone(done: Boolean) { context.dataStore.edit { it[onboardingDoneKey] = done } }
              suspend fun setReaderTutorialDone(done: Boolean) { context.dataStore.edit { it[readerTutorialDoneKey] = done } }

              fun readingMode(itemId: String): Flow<ReadingMode> = context.dataStore.data.map {
                  val raw = it[stringPreferencesKey("$readingModePrefix$itemId")] ?: "PAGED"
                  runCatching { ReadingMode.valueOf(raw) }.getOrDefault(ReadingMode.PAGED)
              }
              suspend fun setReadingMode(itemId: String, mode: ReadingMode) {
                  context.dataStore.edit { it[stringPreferencesKey("$readingModePrefix$itemId")] = mode.name }
              }

              fun progress(itemId: String): Flow<Int> = context.dataStore.data.map {
                  it[intPreferencesKey("$progressPrefix$itemId")] ?: 0
              }
              fun totalPages(itemId: String): Flow<Int> = context.dataStore.data.map {
                  it[intPreferencesKey("$totalPagesPrefix$itemId")] ?: 0
              }
              suspend fun setProgress(itemId: String, page: Int, totalPages: Int) {
                  context.dataStore.edit {
                      it[intPreferencesKey("$progressPrefix$itemId")] = page
                      it[intPreferencesKey("$totalPagesPrefix$itemId")] = totalPages
                      it[longPreferencesKey("$lastReadPrefix$itemId")] = System.currentTimeMillis()
                  }
              }

              suspend fun setEpubFontSize(size: Int) { context.dataStore.edit { it[epubFontSizeKey] = size } }
              suspend fun setEpubDarkMode(dark: Boolean) { context.dataStore.edit { it[epubDarkModeKey] = dark } }
              suspend fun setDynamicColor(enabled: Boolean) { context.dataStore.edit { it[dynamicColorKey] = enabled } }
              suspend fun setThemeModeEnum(mode: ThemeMode) { context.dataStore.edit { it[themeModeKey] = mode.name } }

              val themeModeEnum: Flow<ThemeMode> = context.dataStore.data.map {
                  val raw = it[themeModeKey] ?: "SYSTEM"
                  runCatching { ThemeMode.valueOf(raw) }.getOrDefault(ThemeMode.SYSTEM)
              }
              fun lastReadAt(itemId: String): Flow<Long> = context.dataStore.data.map {
                  it[longPreferencesKey("$lastReadPrefix$itemId")] ?: 0L
              }
          }
          KOTLIN_EOF

