          package com.mangauniversal.app.ui.reader.components
          import android.graphics.Bitmap
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.gestures.detectTransformGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.input.pointer.pointerInput
          @Composable fun ZoomableImage(bitmap: Bitmap?, modifier: Modifier = Modifier) {
              var scale by remember { mutableFloatStateOf(1f) }
              var offsetX by remember { mutableFloatStateOf(0f) }
              var offsetY by remember { mutableFloatStateOf(0f) }
              Box(modifier = modifier.fillMaxSize().pointerInput(Unit) {
                  detectTransformGestures { _, pan, zoom, _ ->
                      scale = (scale * zoom).coerceIn(1f, 5f)
                      if (scale > 1f) { offsetX += pan.x; offsetY += pan.y } else { offsetX = 0f; offsetY = 0f }
                  }
              }, contentAlignment = Alignment.Center) {
                  if (bitmap != null) {
                      Image(bitmap = bitmap.asImageBitmap(), contentDescription = null, modifier = Modifier.fillMaxSize().graphicsLayer(scaleX = scale, scaleY = scale, translationX = offsetX, translationY = offsetY))
                  }
              }
          }
