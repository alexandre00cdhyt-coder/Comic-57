          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.unit.dp
          import com.mangauniversal.app.R
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun HistoryScreen(viewModel: HistoryViewModel, onBookClick: (String, String) -> Unit) {
              val historyList by viewModel.historyState.collectAsState()
              Scaffold(topBar = { TopAppBar(title = { Text(text = stringResource(R.string.history_title)) }) }) { innerPadding ->
                  Box(modifier = Modifier.fillMaxSize().padding(innerPadding)) {
                      if (historyList.isEmpty()) { Text(text = stringResource(R.string.empty_history), modifier = Modifier.align(Alignment.Center)) }
                      else {
                          LazyColumn(modifier = Modifier.fillMaxSize()) {
                              items(historyList) { item ->
                                  Card(modifier = Modifier.fillMaxWidth().padding(8.dp).clickable { onBookClick(item.filePath, item.title) }) {
                                      Column(modifier = Modifier.padding(16.dp)) {
                                          Text(text = item.title, style = MaterialTheme.typography.titleMedium)
                                          Text(text = "Página: ${item.lastPage + 1} / ${item.totalPages}", style = MaterialTheme.typography.bodyMedium)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
