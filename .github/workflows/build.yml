name: Ver PageExtractor y ReaderViewModel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: PageExtractor.kt
        run: |
          echo "========== PageExtractor.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/reader/PageExtractor.kt"

      - name: PageRef.kt
        run: |
          echo "========== PageRef.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/reader/PageRef.kt"

      - name: ReaderViewModel.kt
        run: |
          echo "========== ReaderViewModel.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/reader/ReaderViewModel.kt"

      - name: Copiar a artifact
        run: |
          mkdir -p archivos_reader
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/reader/PageExtractor.kt" archivos_reader/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/reader/PageRef.kt" archivos_reader/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/reader/ReaderViewModel.kt" archivos_reader/
          ls -la archivos_reader/

      - name: Subir archivos
        uses: actions/upload-artifact@v4
        with:
          name: archivos-reader
          path: archivos_reader/
          if-no-files-found: error
