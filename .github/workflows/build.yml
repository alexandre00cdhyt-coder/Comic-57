name: Ver archivos clave de Lumi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Lumi
        run: |
          git clone https://github.com/AmiiGood/Lumi.git lumi

      - name: MainActivity.kt
        run: |
          echo "========== MainActivity.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/MainActivity.kt"

      - name: LumiNavHost.kt
        run: |
          echo "========== LumiNavHost.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/navigation/LumiNavHost.kt"

      - name: LumiDestinations.kt
        run: |
          echo "========== LumiDestinations.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/navigation/LumiDestinations.kt"

      - name: LibraryScanner.kt
        run: |
          echo "========== LibraryScanner.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/scanner/LibraryScanner.kt"

      - name: LumiDatabase.kt
        run: |
          echo "========== LumiDatabase.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/local/LumiDatabase.kt"

      - name: MediaItemDao.kt
        run: |
          echo "========== MediaItemDao.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/local/MediaItemDao.kt"

      - name: MediaItemEntity.kt
        run: |
          echo "========== MediaItemEntity.kt =========="
          cat "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/local/MediaItemEntity.kt"

      - name: Copiar a artifact
        run: |
          mkdir -p archivos_lumi
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/MainActivity.kt" archivos_lumi/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/navigation/LumiNavHost.kt" archivos_lumi/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/ui/navigation/LumiDestinations.kt" archivos_lumi/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/scanner/LibraryScanner.kt" archivos_lumi/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/local/LumiDatabase.kt" archivos_lumi/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/local/MediaItemDao.kt" archivos_lumi/
          cp "lumi/app/src/main/java/io.github.amiigood.lumi/lumi/data/local/MediaItemEntity.kt" archivos_lumi/
          echo "=== Archivos copiados ==="
          ls -la archivos_lumi/

      - name: Subir archivos
        uses: actions/upload-artifact@v4
        with:
          name: archivos-lumi-clave
          path: archivos_lumi/
          if-no-files-found: error
