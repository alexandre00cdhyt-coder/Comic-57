name: Compilar Gestor de Archivos

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Limpiar estructura
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/mangauniversal/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26

      - name: settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'GestorArchivos'
          include ':app'
          EOF

      - name: build.gradle raiz
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

      - name: gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

      - name: app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.mangauniversal.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.mangauniversal.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'io.coil-kt:coil:2.5.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'
              implementation 'androidx.activity:activity-ktx:1.8.2'
              implementation 'androidx.fragment:fragment-ktx:1.6.2'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.GestorArchivos"
                  tools:targetApi="34">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".VisorActivity"
                      android:exported="false"
                      android:label="Visor" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

      - name: file_paths.xml
        run: |
          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external" path="." />
              <external-files-path name="external_files" path="." />
              <files-path name="internal_files" path="." />
              <cache-path name="cache" path="." />
          </paths>
          EOF

      - name: strings.xml en español
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Gestor de Archivos</string>
              <string name="almacenamiento_interno">Almacenamiento interno</string>
              <string name="almacenamiento_externo">Almacenamiento externo</string>
              <string name="galeria">Galería</string>
              <string name="documentos">Documentos</string>
              <string name="descargas">Descargas</string>
              <string name="imagenes">Imágenes</string>
              <string name="videos">Videos</string>
              <string name="musica">Música</string>
              <string name="permiso_titulo">Permiso necesario</string>
              <string name="permiso_mensaje">Esta app necesita acceso a tus archivos para funcionar. Por favor acepta el permiso.</string>
              <string name="permiso_boton">Dar permiso</string>
              <string name="carpeta_vacia">Carpeta vacía</string>
              <string name="eliminar">Eliminar</string>
              <string name="renombrar">Renombrar</string>
              <string name="copiar">Copiar</string>
              <string name="mover">Mover</string>
              <string name="cancelar">Cancelar</string>
              <string name="aceptar">Aceptar</string>
              <string name="nombre_nuevo">Nombre nuevo</string>
              <string name="confirmar_eliminar">¿Seguro que quieres eliminar?</string>
              <string name="si">Sí</string>
              <string name="no">No</string>
              <string name="abrir">Abrir</string>
              <string name="nueva_carpeta">Nueva carpeta</string>
              <string name="nombre_carpeta">Nombre de la carpeta</string>
              <string name="crear">Crear</string>
              <string name="error">Error</string>
              <string name="ok">OK</string>
              <string name="atras">Atrás</string>
              <string name="raiz">Raíz</string>
              <string name="cargando">Cargando…</string>
              <string name="operacion_exitosa">Operación exitosa</string>
              <string name="operacion_fallida">Operación fallida</string>
          </resources>
          EOF

      - name: themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.GestorArchivos" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#1565C0</item>
                  <item name="colorPrimaryVariant">#0D47A1</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="colorSecondary">#00ACC1</item>
                  <item name="colorOnSecondary">#FFFFFF</item>
                  <item name="android:statusBarColor">#0D47A1</item>
